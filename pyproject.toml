[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[project]
name = "pyemu"
version = "1.4.1.dev1"
authors = [
    { name = "Jeremy White", email = "jtwhite1000@gmail.com" },
    { name = "Mike Fienen", email = "mnfienen@usgs.gov" },
    { name = "Brioch Hemmings", email = "bhemmings@intera.com" },
]
description = "pyEMU is a set of python modules for interfacing with PEST and PEST++"
readme = "README.md"
keywords = ["pest", "pestpp"]
license = "BSD-3-Clause"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
optional = [
    "flopy>=3.9.5",
    "matplotlib>=3.10.7",
    "pypestutils>=0.3.0",
    "pyshp>=3.0.2.post1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
]

tests = [
    "flaky>=3.8.1",
    "modflow-devtools>=1.8.0",
    "nbval>=0.11.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

docs = [
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.1",
    "sphinx-rtd-theme>=3.0.2",
]

[dependency-groups]
dev = [
    "flaky>=3.8.1",
    "flopy>=3.9.5",
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "modflow-devtools>=1.8.0",
    "nbval>=0.11.0",
    "pypestutils>=0.3.0",
    "pyshp>=3.0.2.post1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
]

[project.scripts]
get-pestpp = "pyemu.utils.get_pestpp:cli_main"

[tool.uv.build-backend]
module-name = "pyemu"
module-root = ""

[tool.pytest.ini_options]
testpaths = [
    "autotest",
]
addopts = "--cov-config=pyproject.toml"

python_functions = [
    "*_test",
    "test_*"
]
norecursedirs = '*'
python_files = "*_tests.py"

[tool.coverage.run]
source = ["pyemu"]
parallel = true
relative_files = true
patch = ["subprocess"]
omit = [
    "*/legacy/*"
    ]

